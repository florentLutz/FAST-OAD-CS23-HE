# Need custom methods to include the effect of the release of H2 by ground infrastructure, see
# :cite:`sand:2026`
custom_methods:
    - name: "('Custom methods', 'climate change', 'global warming potential (GWP100)')"
      filepath: 'lcia_gwp100_custom.csv'  # the LCA module will automatically format it correctly. Just needs the filename and the file to be in the resources folder
      unit: 'kg CO2-Eq'
      source_method: "('EF v3.1 no LT', 'climate change', 'global warming potential (GWP100)')"

    - name: "('Custom methods', 'climate change: biogenic', 'global warming potential (GWP100)')"
      filepath: 'lcia_gwp100_custom.csv'
      unit: 'kg CO2-Eq'
      source_method: "('EF v3.1 no LT', 'climate change: biogenic', 'global warming potential (GWP100)')"

    - name: "('Custom methods', 'climate change: fossil', 'global warming potential (GWP100)')"
      filepath: 'lcia_gwp100_custom.csv'
      unit: 'kg CO2-Eq'
      source_method: "('EF v3.1 no LT', 'climate change: fossil', 'global warming potential (GWP100)')"

    - name: "('Custom methods', 'climate change: land use and land use change', 'global warming potential (GWP100)')"
      filepath: 'lcia_gwp100_custom.csv'
      unit: 'kg CO2-Eq'
      source_method: "('EF v3.1 no LT', 'climate change: land use and land use change', 'global warming potential (GWP100)')"