title: Sample OAD Process

# List of folder paths where user added custom registered OpenMDAO components
module_folders:

# Input and output files
input_file: ../../results/generated/ampere_final_in.xml
output_file: ../../results/generated/ampere_final_out.xml

# NOTE (scope): this case reuses the Pipistrel airframe geometry (fuselage/wing/tail structural
# template, CG methodology) and only swaps in the Ampere propulsion architecture (40 EDF / 10
# hybrid PEMFC+H2+battery clusters) at Ampere-like power levels, plus the real Ampere wing/HTP
# area and TLAR values (Hermetz, Ridel & Doll, 2016 ICAS) where the geometry module allows it.
# It is a propulsion-architecture validation at Ampere scale, not a faithful Ampere sizing result.

# Definition of problem driver assuming the OpenMDAO convention "import openmdao.api as om"
driver: om.ScipyOptimizeDriver(tol=1e-2, optimizer='COBYLA',
  debug_print=["objs"])

model:
  aircraft_sizing:
    nonlinear_solver: om.NonlinearBlockGS(maxiter=20, iprint=2, rtol=1e-5,
      debug_print=True, reraise_child_analysiserror=True)
    linear_solver: om.LinearBlockGS()
    geometry:
      id: fastga.geometry.legacy
      propulsion_id: fastga.wrapper.propulsion.basicIC_engine
      cabin_sizing: 0.0 # Manually input the front, rear and cabin length
    aerodynamics_lowspeed:
      id: fastga.aerodynamics.lowspeed.legacy
      propulsion_id: fastga.wrapper.propulsion.basicIC_engine
      result_folder_path: ../workdir_ampere_final
      compute_slipstream: false
    aerodynamics_highspeed:
      id: fastga.aerodynamics.highspeed.legacy
      propulsion_id: fastga.wrapper.propulsion.basicIC_engine
      result_folder_path: ../workdir_ampere_final
      compute_mach_interpolation: false
      compute_slipstream: false
    performances:
      id: fastga_he.performances.mission_vector
      # Reduced point counts (10/10/5/5) for faster convergence checks; raise to 30/30/20/10 for
      # production-quality mission profiles.
      number_of_points_climb: 10
      number_of_points_cruise: 10
      number_of_points_descent: 5
      number_of_points_reserve: 5
      power_train_file_path: assembly_ampere_final.yml
      out_file: ../../results/generated/ampere_final_mission_data.csv
      use_linesearch: false
      pre_condition_pt: true
      use_apply_nonlinear: false
    power_train_sizing:
      id: fastga_he.power_train.sizing
      power_train_file_path: assembly_ampere_final.yml
    weight:
      id: fastga.weight.legacy
      propulsion_id: fastga.wrapper.propulsion.basicIC_engine
    mtow:
      id: fastga.loop.mtow
    hq:
      tail_sizing:
        id: fastga.handling_qualities.tail_sizing
        propulsion_id: fastga.wrapper.propulsion.basicIC_engine
      static_margin:
        id: fastga.handling_qualities.static_margin
    wing_position:
      id: fastga.loop.wing_position
    wing_area:
      # fastga_he.loop.wing_area (UpdateWingAreaLiftDEPEquilibrium) sizes the wing against a
      # landing/approach equilibrium that credits each ducted fan's slipstream lift, unlike the
      # plain fastga.loop.wing_area (stall-speed/CL_max formula, no propulsion coupling) -- see
      # Dillinger et al., ICAS 2018-0492, on the blown-wing high-lift effect central to the real
      # AMPERE design. Exposes "_landing" control-parameter inputs (thrust_distribution_landing,
      # power_split_landing, etc. per cluster), filled from their "_mission" siblings by
      # run_ampere_case.py's _fill_landing_control_params_from_mission().
      id: fastga_he.loop.wing_area
      power_train_file_path: assembly_ampere_final.yml
      produce_simplified_pt_file: True


submodels:
  submodel.propulsion.constraints.pmsm.rpm: fastga_he.submodel.propulsion.constraints.pmsm.rpm.ensure
  submodel.propulsion.constraints.pmsm.torque: fastga_he.submodel.propulsion.constraints.pmsm.torque.enforce
  submodel.propulsion.inverter.junction_temperature: fastga_he.submodel.propulsion.inverter.junction_temperature.from_losses
  submodel.propulsion.inverter.efficiency: fastga_he.submodel.propulsion.inverter.efficiency.from_losses
  submodel.propulsion.constraints.inverter.current: fastga_he.submodel.propulsion.constraints.inverter.current.enforce
  # .ensure keeps number_modules fixed (16/cluster, seeded by run_ampere_case.py) rather than
  # auto-sizing it (.enforce) -- .enforce is unstable for this case, since an oversized battery
  # trivially satisfies the SOC constraint with no pressure pushing it back down.
  submodel.propulsion.constraints.battery.state_of_charge: fastga_he.submodel.propulsion.constraints.battery.state_of_charge.ensure
  # .constant avoids a current-jump instability in the dynamic thermal model when
  # dc_bus_group_N aggregates 4 propulsors onto a single harness_central_N. Swap to
  # .steady_state if .constant isn't registered in your environment.
  submodel.propulsion.performances.dc_line.temperature_profile: fastga_he.submodel.propulsion.performances.dc_line.temperature_profile.constant
  submodel.weight.cg.aircraft_empty.x: fastga_he.submodel.weight.cg.aircraft_empty.x.with_propulsion_as_one
  # fastga_he's "simple" submodel (fixed MAC position) avoids fsolve-based max-speed root-finding,
  # which has no valid thrust=drag root for this distributed 40-fan power-train architecture.
  submodel.weight.cg.loadcase.flight: fastga_he.submodel.weight.cg.loadcase.flight.simple
  submodel.performances.mission_vector.climb_speed:
  submodel.performances.mission_vector.descent_speed:
  service.weight.mass.system.power_system:
  service.weight.mass.system.avionics_system:
  service.weight.mass.system.life_support_system:
  service.weight.mass.system.recording_system:
  service.weight.mass.systems: fastga_he.submodel.weight.mass.systems.weight_nan
  service.weight.mass.payload:
  service.geometry.nacelle.dimension:
  submodel.propulsion.constraints.inductor.air_gap: fastga_he.submodel.propulsion.constraints.inductor.air_gap.enforce
  submodel.propulsion.dc_dc_converter.inductor.inductance:
  service.weight.mass.airframe.wing: fastga_he.submodel.weight.mass.airframe.wing.analytical_he
  submodel.handling_qualities.vertical_tail.area:
