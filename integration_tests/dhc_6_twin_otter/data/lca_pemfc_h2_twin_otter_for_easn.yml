title: LCA computation for reference DHC 6 TWIN OTTER

# List of folder paths where user added custom registered OpenMDAO components
module_folders:


# Input and output files
input_file: ../results/lca_inputs_pemfc_h2_twin_otter_for_easn.xml
output_file: ../results/lca_outputs_pemfc_h2_twin_otter_for_easn.xml

# Definition of problem driver assuming the OpenMDAO convention "import openmdao.api as om"
driver: om.ScipyOptimizeDriver(tol=1e-2, optimizer='COBYLA')

model:
    lca:
        id: fastga_he.lca.legacy
        power_train_file_path: ./pemfc_h2_propulsion.yml
        component_level_breakdown: true
        airframe_material: aluminium
        delivery_method: flight
        impact_assessment_method: EF v3.1
        normalization: true
        weighting: true
        aircraft_lifespan_in_hours: true
        write_lca_conf: false
        lca_conf_file_path: ./pemfc_h2_propulsion_lca.yml
