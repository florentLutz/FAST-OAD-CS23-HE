<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Powertrain Builder — Runtime Event Flow</title>
<style>
  :root {
    --bg:#ffffff; --bg2:#f7f6f3; --bg3:#f1efe8;
    --text:#2c2c2a; --text2:#5f5e5a; --text3:#888780;
    --border:rgba(0,0,0,0.12); --border2:rgba(0,0,0,0.22);
    --radius:10px;
    --font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",monospace;
    --purple-fill:#eeedfe; --purple-border:#534ab7; --purple-text:#3c3489;
    --teal-fill:#e1f5ee;   --teal-border:#0f6e56;   --teal-text:#085041;
    --coral-fill:#faece7;  --coral-border:#993c1d;  --coral-text:#712b13;
    --gray-fill:#f1efe8;   --gray-border:#5f5e5a;   --gray-text:#2c2c2a;
    --amber-fill:#faeeda;  --amber-border:#854f0b;  --amber-text:#633806;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1e1e1c; --bg2:#272724; --bg3:#2c2c2a;
      --text:#e8e6dc; --text2:#b4b2a9; --text3:#5f5e5a;
      --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.2);
      --purple-fill:#26215c; --purple-border:#7f77dd; --purple-text:#cecbf6;
      --teal-fill:#04342c;   --teal-border:#1d9e75;   --teal-text:#9fe1cb;
      --coral-fill:#4a1b0c;  --coral-border:#d85a30;  --coral-text:#f5c4b3;
      --gray-fill:#2c2c2a;   --gray-border:#888780;   --gray-text:#d3d1c7;
      --amber-fill:#412402;  --amber-border:#ba7517;  --amber-text:#fac775;
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);padding:32px 24px 48px;max-width:1200px;margin:0 auto;}
  .breadcrumb{font-size:12px;color:var(--text3);margin-bottom:10px;letter-spacing:0.02em;}
  .breadcrumb span{margin:0 6px;}
  .page-header{margin-bottom:24px;padding-bottom:18px;border-bottom:0.5px solid var(--border);}
  .page-header h1{font-size:22px;font-weight:500;color:var(--text);margin-bottom:4px;}
  .page-header p{font-size:14px;color:var(--text2);line-height:1.6;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
  .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

  /* Diagram on top, full width */
  .diagram-wrap{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:20px 16px 12px;margin-bottom:16px;overflow-x:auto;}
  .hint{font-size:11px;color:var(--text3);text-align:center;margin-top:8px;}
  .flow-svg{display:block;}

  /* Description panel below */
  .desc-panel{border:0.5px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
  .step-nav{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px 0;background:var(--bg2);border-bottom:0.5px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;flex-shrink:0;min-height:38px;}
  .step-tab{display:flex;align-items:center;gap:5px;padding:5px 10px 6px;font-size:11px;font-weight:500;border-radius:6px 6px 0 0;border:0.5px solid transparent;border-bottom:none;cursor:pointer;color:var(--text3);background:transparent;transition:color .13s,background .13s;user-select:none;white-space:nowrap;margin-bottom:2px;}
  .step-tab:hover{color:var(--text2);background:var(--bg3);}
  .step-tab.active{color:var(--text);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);margin-bottom:-0.5px;z-index:1;}
  .step-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .desc-content{padding:18px 22px 16px;background:var(--bg);}
  .desc-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;letter-spacing:0.01em;}
  .tag.purple{background:var(--purple-fill);color:var(--purple-text);}
  .tag.teal{background:var(--teal-fill);color:var(--teal-text);}
  .tag.coral{background:var(--coral-fill);color:var(--coral-text);}
  .tag.gray{background:var(--gray-fill);color:var(--gray-text);}
  .tag.amber{background:var(--amber-fill);color:var(--amber-text);}
  .desc-body{font-size:13px;color:var(--text2);line-height:1.7;}
  .desc-body code{font-family:var(--mono);font-size:11.5px;background:var(--bg3);padding:1px 5px;border-radius:4px;color:var(--text);}
  .desc-nav{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 11px;border-top:0.5px solid var(--border);background:var(--bg2);border-radius:0 0 var(--radius) var(--radius);}
  .nav-btn{font-size:12px;color:var(--text3);background:none;border:0.5px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;transition:color .12s,border-color .12s,background .12s;}
  .nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3);}
  .nav-btn:disabled{opacity:0.3;cursor:default;}
  .nav-counter{font-size:11px;color:var(--text3);}

  /* SVG nodes */
  .fl-node{cursor:pointer;}
  .fl-node rect{transition:filter .13s;}
  .fl-node:hover rect{filter:brightness(0.92);}
  .fl-node.active rect{stroke-width:1.5 !important;}
</style>
</head>
<body>

<!--<div class="breadcrumb">Powertrain Builder <span>›</span> Reference <span>›</span> Runtime Event Flow</div>-->
<div class="page-header">
  <h1>Runtime event flow</h1>
  <p>Click any block in the diagram or use the step tabs below to read implementation details.</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--gray-fill);border:1px solid var(--gray-border)"></div>Browser / Bokeh layer</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--purple-fill);border:1px solid var(--purple-border)"></div>Central dispatcher</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--coral-fill);border:1px solid var(--coral-border)"></div>Action branches</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--teal-fill);border:1px solid var(--teal-border)"></div>State mutation</div>
</div>



<!-- Diagram full width on top -->
<div class="diagram-wrap">

  <!-- ── FLOW A: Canvas interaction (left→right) ── -->
  <!--
    Layout plan (all y-coords centred on row midpoints):
    Row heights: top-rail y=30 (config/apply side path), main row y=140, bottom-rail y=250 (undo/redo return)
    X columns:
      C0 user tap   x=10  w=110  cx=65
      C1 dispatcher x=140 w=160  cx=220
      branches fan vertically at x=330, w=90, 5 rows spaced 54px: y=14,68,122,176,230  (total height ~290)
      C2 push_undo  x=450 w=130  cx=515
      C3 mutate     x=600 w=150  cx=675
      C4 rebuild    x=770 w=130  cx=835
      C5 bokeh      x=920 w=150  cx=995
      C6 undo/redo  x=920 w=150 (below, y=250 rail)
    viewBox: 0 0 1100 310
  -->
  <svg class="flow-svg" id="svg-canvas" width="100%" viewBox="0 0 1110 310" role="img">
    <title>Canvas interaction event flow</title>
    <defs>
      <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ── C0: User tap ── -->
    <g class="fl-node" id="ca-useraction" onclick="activate('useraction')">
      <rect x="10" y="115" width="110" height="44" rx="7" fill="var(--gray-fill)" stroke="var(--gray-border)" stroke-width="0.75"/>
      <text x="65" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--gray-text)" font-family="system-ui,-apple-system,sans-serif">User tap</text>
      <text x="65" y="149" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--gray-border)" font-family="system-ui,-apple-system,sans-serif">on canvas</text>
    </g>
    <line x1="120" y1="137" x2="138" y2="137" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>

    <!-- ── C1: Dispatcher ── -->
    <g class="fl-node" id="ca-tap" onclick="activate('tap')">
      <rect x="140" y="105" width="160" height="64" rx="7" fill="var(--purple-fill)" stroke="var(--purple-border)" stroke-width="0.75"/>
      <text x="220" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--purple-text)" font-family="system-ui,-apple-system,sans-serif">on_canvas_tap()</text>
      <text x="220" y="148" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--purple-border)" font-family="system-ui,-apple-system,sans-serif">PlacementHandler</text>
      <text x="220" y="161" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--purple-border)" font-family="system-ui,-apple-system,sans-serif">reads mode + selected</text>
    </g>

    <!-- 5 fan lines from dispatcher right edge to branch boxes -->
    <!-- branch y-centres: 21, 75, 129, 183, 237  (boxes h=44, gap=10) -->
    <line x1="300" y1="122" x2="328" y2="63"  stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="300" y1="130" x2="328" y2="117"  stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="300" y1="137" x2="328" y2="171" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="300" y1="144" x2="328" y2="225" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="300" y1="152" x2="328" y2="279" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>

    <!-- ── Branches ── x=330 w=90 -->
    <!-- 3a: delete edge -->
    <g class="fl-node" id="ca-deleteedge" onclick="activate('deleteedge')">
      <rect x="330" y="42" width="90" height="42" rx="6" fill="var(--coral-fill)" stroke="var(--coral-border)" stroke-width="0.75"/>
      <text x="375" y="56" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--coral-text)" font-family="system-ui,-apple-system,sans-serif">delete edge</text>
      <text x="375" y="70" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--coral-border)" font-family="system-ui,-apple-system,sans-serif">find nearest</text>
    </g>
    <!-- 3b: port tap -->
    <g class="fl-node" id="ca-porttap" onclick="activate('porttap')">
      <rect x="330" y="96" width="90" height="42" rx="6" fill="var(--coral-fill)" stroke="var(--coral-border)" stroke-width="0.75"/>
      <text x="375" y="110" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--coral-text)" font-family="system-ui,-apple-system,sans-serif">port tap</text>
      <text x="375" y="124" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--coral-border)" font-family="system-ui,-apple-system,sans-serif">2-click edge</text>
    </g>
    <!-- 3c: place icon -->
    <g class="fl-node" id="ca-place" onclick="activate('place')">
      <rect x="330" y="150" width="90" height="42" rx="6" fill="var(--coral-fill)" stroke="var(--coral-border)" stroke-width="0.75"/>
      <text x="375" y="164" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--coral-text)" font-family="system-ui,-apple-system,sans-serif">place icon</text>
      <text x="375" y="178" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--coral-border)" font-family="system-ui,-apple-system,sans-serif">new node</text>
    </g>
    <!-- 3d: delete node -->
    <g class="fl-node" id="ca-delete" onclick="activate('delete')">
      <rect x="330" y="204" width="90" height="42" rx="6" fill="var(--coral-fill)" stroke="var(--coral-border)" stroke-width="0.75"/>
      <text x="375" y="218" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--coral-text)" font-family="system-ui,-apple-system,sans-serif">delete node</text>
      <text x="375" y="232" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--coral-border)" font-family="system-ui,-apple-system,sans-serif">rm node+edges</text>
    </g>
    <!-- 3e: select node -->
    <g class="fl-node" id="ca-selectnode" onclick="activate('selectnode')">
      <rect x="330" y="258" width="90" height="42" rx="6" fill="var(--coral-fill)" stroke="var(--coral-border)" stroke-width="0.75"/>
      <text x="375" y="272" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--coral-text)" font-family="system-ui,-apple-system,sans-serif">select node</text>
      <text x="375" y="287" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--coral-border)" font-family="system-ui,-apple-system,sans-serif">config panel</text>
    </g>

    <!-- select node → config panel (dashed, goes up then right) -->
    <path d="M420 279 L420 279 L480 279 " stroke="#888780" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#fa)" fill="none"/>

    <!-- Config panel (top-rail side path) at x=480 y=258 (above main flow) -->
    <g class="fl-node" id="ca-configpanel" onclick="activate('configpanel')">
      <rect x="480" y="258" width="120" height="44" rx="7" fill="var(--purple-fill)" stroke="var(--purple-border)" stroke-width="0.75"/>
      <text x="540" y="272" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--purple-text)" font-family="system-ui,-apple-system,sans-serif">Config panel</text>
      <text x="540" y="287" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--purple-border)" font-family="system-ui,-apple-system,sans-serif">name·type·opts·conns</text>
    </g>
    <!-- Apply button (right of config panel, dashed) -->
    <line x1="600" y1="280" x2="618" y2="280" stroke="#888780" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#fa)"/>
    <g class="fl-node" id="ca-apply" onclick="activate('apply')">
      <rect x="620" y="258" width="110" height="44" rx="7" fill="var(--teal-fill)" stroke="var(--teal-border)" stroke-width="0.75"/>
      <text x="675" y="272" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--teal-text)" font-family="system-ui,-apple-system,sans-serif">Apply button</text>
      <text x="675" y="287" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--teal-border)" font-family="system-ui,-apple-system,sans-serif">write to source</text>
    </g>
    <!-- Apply merges up into push_undo (dashed) -->
    <path d="M730 280 L760 280 L760 175 L750 175" stroke="#888780" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#fa)" fill="none"/>

    <!-- Converge lines: branches 3b–3e → push_undo -->
    <!-- port tap, place icon, delete node, delete edge all merge right into push_undo -->
    <line x1="420" y1="63" x2="438" y2="120" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="420" y1="117"  x2="438" y2="145" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="420" y1="171" x2="438" y2="160" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>
    <line x1="420" y1="225" x2="438" y2="175" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>


    <!-- ── C2: Push undo ── x=440 -->
    <g class="fl-node" id="ca-pushundo" onclick="activate('pushundo')">
      <rect x="440" y="115" width="140" height="64" rx="7" fill="var(--teal-fill)" stroke="var(--teal-border)" stroke-width="0.75"/>
      <text x="510" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--teal-text)" font-family="system-ui,-apple-system,sans-serif">_push_undo()</text>
      <text x="510" y="155" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--teal-border)" font-family="system-ui,-apple-system,sans-serif">make_snapshot()</text>
      <text x="510" y="169" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--teal-border)" font-family="system-ui,-apple-system,sans-serif">→ UndoStack</text>
    </g>
    <line x1="580" y1="147" x2="598" y2="147" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>

    <!-- ── C3: Mutate ── x=600 -->
    <g class="fl-node" id="ca-mutate" onclick="activate('mutate')">
      <rect x="600" y="105" width="150" height="84" rx="7" fill="var(--gray-fill)" stroke="var(--gray-border)" stroke-width="0.75"/>
      <text x="675" y="127" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--gray-text)" font-family="system-ui,-apple-system,sans-serif">BuilderState</text>
      <text x="675" y="143" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--gray-text)" font-family="system-ui,-apple-system,sans-serif">sources mutated</text>
      <text x="675" y="161" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--gray-border)" font-family="system-ui,-apple-system,sans-serif">nodes / edges / ports</text>
      <text x="675" y="177" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--gray-border)" font-family="system-ui,-apple-system,sans-serif">.data → Bokeh diffs</text>
    </g>
    <line x1="750" y1="147" x2="768" y2="147" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>

    <!-- ── C4: Rebuild ports ── x=770 -->
    <g class="fl-node" id="ca-rebuild" onclick="activate('rebuild')">
      <rect x="770" y="115" width="140" height="64" rx="7" fill="var(--teal-fill)" stroke="var(--teal-border)" stroke-width="0.75"/>
      <text x="840" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--teal-text)" font-family="system-ui,-apple-system,sans-serif">_rebuild_all</text>
      <text x="840" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--teal-text)" font-family="system-ui,-apple-system,sans-serif">_ports()</text>
      <text x="840" y="169" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--teal-border)" font-family="system-ui,-apple-system,sans-serif">→ _rebuild_edges()</text>
    </g>
    <line x1="910" y1="147" x2="928" y2="147" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)"/>

    <!-- ── C5: Bokeh push ── x=930 -->
    <g class="fl-node" id="ca-bokeh" onclick="activate('bokeh')">
      <rect x="930" y="115" width="160" height="64" rx="7" fill="var(--gray-fill)" stroke="var(--gray-border)" stroke-width="0.75"/>
      <text x="1010" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--gray-text)" font-family="system-ui,-apple-system,sans-serif">Bokeh pushes</text>
      <text x="1010" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--gray-text)" font-family="system-ui,-apple-system,sans-serif">diff to browser</text>
      <text x="1010" y="170" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--gray-border)" font-family="system-ui,-apple-system,sans-serif">WebSocket patch</text>
    </g>

    <!-- Undo/redo bottom rail: bokeh bottom → rail down → left → up into mutate bottom -->
    <path d="M1010 179 L1010 220 L675 220 L675 189" stroke="#888780" stroke-width="1.6" marker-end="url(#fa)" fill="none"/>
    <text x="843" y="215" text-anchor="middle" font-size="12" fill="var(--text3)" font-family="system-ui,-apple-system,sans-serif">undo / redo</text>

    <!-- Undo/redo node sits on the bottom rail -->
    <g class="fl-node" id="ca-undoredo" onclick="activate('undoredo')">
      <rect x="790" y="228" width="180" height="52" rx="7" fill="var(--purple-fill)" stroke="var(--purple-border)" stroke-width="0.75"/>
      <text x="880" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--purple-text)" font-family="system-ui,-apple-system,sans-serif">_on_undo() / _on_redo()</text>
      <text x="880" y="265" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--purple-border)" font-family="system-ui,-apple-system,sans-serif">IOMixin · pop snapshot → restore</text>
    </g>
    <!-- undo/redo box connects up to the bottom rail via a short line -->
    <line x1="880" y1="228" x2="880" y2="220" stroke="#888780" stroke-width="1.6" stroke-dasharray="4 3"/>

  </svg>


  <p class="hint">Click any block to read details ↓</p>
</div>

<!-- Description panel below -->
<div class="desc-panel">
  <div class="step-nav" id="step-nav"></div>
  <div class="desc-content" id="desc-content">
    <div class="desc-title" id="dp-title"></div>
    <div class="tags"       id="dp-tags"></div>
    <div class="desc-body"  id="dp-body"></div>
  </div>
  <div class="desc-nav">
    <button class="nav-btn" id="btn-prev" onclick="navStep(-1)">← Prev</button>
    <span class="nav-counter" id="nav-counter"></span>
    <button class="nav-btn" id="btn-next" onclick="navStep(1)">Next →</button>
  </div>
</div>

<script>
const flowA = [
  { key:'useraction', color:'gray', label:'1',
    title:'User tap on canvas',
    tags:['Bokeh Tap event','on_canvas_tap'],
    body:`Any click on the canvas fires a Bokeh <code>Tap</code> event carrying <code>event.x</code> and <code>event.y</code> in canvas data-units. Button clicks (Delete, Undo, Redo) fire synchronous Python <code>on_click</code> callbacks. Both paths are handled entirely in Python — no JS roundtrip except for the hidden trigger <code>TextInput</code> toggles used for the save/load/end-session flows.`
  },
  { key:'tap', color:'purple', label:'2',
    title:'on_canvas_tap(event)',
    tags:['PlacementHandler','Dispatcher'],
    body:`The central dispatcher. Reads <code>state.delete_mode</code> and <code>state.selected_component</code> to decide which branch to enter. Priority order: (1) if idle and no component selected, check for a nearby port first (highest priority). (2) If delete mode, find nearest node or edge and remove it. (3) If component selected, place a new icon. (4) Otherwise, select or deselect the nearest existing node and open the config panel.`
  },
  { key:'selectnode', color:'coral', label:'3a',
    title:'Select node branch',
    tags:['_best_possible_node()','_populate_node_table()'],
    body:`Called when the user taps near an existing node in idle mode. <code>_best_possible_node(x, y)</code> finds the nearest node within snap distance. If found (and different from the currently selected one), <code>state.selected_node_index</code> is updated and <code>_populate_node_table(index)</code> fills the config panel widgets: name input, type select, position select, options table, port-count spinners, connections table, and symmetry select. No undo snapshot is pushed — selection itself is non-destructive.`
  },
  { key:'porttap', color:'coral', label:'3b',
    title:'_handle_port_tap()',
    tags:['PortEdgeMixin','Two-click workflow'],
    body:`First tap: stores the port as <code>state.pending_port</code> and highlights it with <code>pending_port_source</code>. Second tap on a compatible port (opposite kind, same energy colour): calls <code>_push_undo()</code> then <code>_add_edge(pending, port)</code> which writes to <code>edge_source</code>. Same port tapped twice cancels selection. Incompatible port is silently ignored. The undo push happens only on the second tap, immediately before the permanent edge is committed.`
  },
  { key:'place', color:'coral', label:'3c',
    title:'Place icon branch',
    tags:['on_canvas_tap','placed_nodes_source'],
    body:`Pushes undo, then appends one new row to every column of <code>placed_nodes_source.data</code>: coordinates, base64 icon URL, node name (<code>icon_key_N</code>), <code>node_type</code>, <code>position</code>, <code>options</code> JSON, default port counts, empty symmetry fields. Also appends to <code>hover_source</code>. Increments <code>state.placed_counter[icon_key]</code> so the next placement gets a unique suffix. Finally calls <code>_rebuild_all_ports()</code> and <code>_mark_unsaved()</code>.`
  },
  { key:'delete', color:'coral', label:'3d',
    title:'Delete node branch',
    tags:['PortEdgeMixin._best_possible_node','edge re-index'],
    body:`Calls <code>_best_possible_node(x, y)</code> within snap distance. If found: pushes undo, removes the node row from <code>placed_nodes_source.data</code>, removes all edges that touch that node from <code>edge_source.data</code>, then re-indexes surviving edge node indices so they remain consistent. Calls <code>_rebuild_all_ports()</code>. If the deleted node was selected, clears the config panel.`
  },
  { key:'deleteedge', color:'coral', label:'3e',
    title:'Delete edge branch',
    tags:['PortEdgeMixin._find_nearest_edge','12 px snap'],
    body:`Reached when delete mode is active and no node is within snap distance. <code>_find_nearest_edge(x, y)</code> computes the perpendicular distance from the tap to every edge line using the stored <code>xs/ys</code> columns. The nearest edge within 12 px is removed by popping its row from <code>edge_source.data</code>. Pushes undo before removal. If a node is selected, refreshes its connections table.`
  },
  { key:'configpanel', color:'purple', label:'4',
    title:'Config panel (ConfigPanelMixin)',
    tags:['_populate_node_table()','_refresh_connections_table()'],
    body:`<code>_populate_node_table(index)</code> fills name input, type select, position select, options table (one row per option with a Select widget), port-count spinners (visible only for variable-port components), and the connections table. <code>_refresh_connections_table()</code> builds dynamic Select rows for each port — selecting a new value calls <code>_on_port_select_change()</code> which draws a preview dashed edge or removes a permanent one (pushing undo for disconnect). The panel is shown by setting <code>state.table_panel.visible = True</code>.`
  },
  { key:'apply', color:'teal', label:'5',
    title:'Apply button → write back',
    tags:['apply_node_configurations','placed_nodes_source'],
    body:`Registered by the launcher as an <code>on_click</code> callback. Reads current values from all config panel widgets (name input, type select, position select, options selects, port-count spinners, symmetry select) and writes them back into the corresponding row of <code>placed_nodes_source.data</code>. Pushes undo before the write. Any pending preview connections in <code>state.pending_connections</code> are also committed as permanent edges to <code>edge_source</code> at this point.`
  },
  { key:'pushundo', color:'teal', label:'6',
    title:'IOMixin._push_undo()',
    tags:['make_snapshot()','UndoStack.push()'],
    body:`Calls <code>make_snapshot(self.state)</code> which <code>copy.deepcopy</code>s all four data source dicts plus <code>placed_counter</code> into a plain Python dict (no Bokeh objects stored). Calls <code>self.state.undo_stack.push(snapshot)</code> which appends to the <code>_undo</code> deque and clears the <code>_redo</code> deque (a new mutation invalidates redo history). Finally calls <code>_refresh_undo_redo_buttons()</code>.`
  },
  { key:'mutate', color:'gray', label:'7',
    title:'BuilderState sources mutated',
    tags:['ColumnDataSource','Bokeh reactive'],
    body:`Each mutation rebuilds the affected dict locally then reassigns <code>source.data = new_dict</code>. Reassigning <code>.data</code> (not mutating in-place) is required for Bokeh to detect the change and schedule a WebSocket push to the browser. The browser's Bokeh JS client receives a binary patch and re-renders only the changed glyphs without a full page reload. The <code>_sync_labels</code> callback on <code>placed_nodes_source</code> keeps the label overlay in sync automatically.`
  },
  { key:'rebuild', color:'teal', label:'8',
    title:'_rebuild_all_ports()',
    tags:['PortEdgeMixin','compute_ports()'],
    body:`Iterates all placed nodes and calls <code>compute_ports(cx, cy, NODE_RADIUS, PORT_RADIUS, n_source, n_target)</code> from <code>state.py</code> for each. Port ball positions are fanned geometrically around the node circle. Writes the full <code>source_port_source.data</code> and <code>target_port_source.data</code> dicts from scratch, including the <code>connected</code> column derived from current edges. Calls <code>_rebuild_edges()</code> at the end to update <code>xs/ys</code> so edge lines follow moved nodes.`
  },
  { key:'bokeh', color:'gray', label:'9',
    title:'Bokeh pushes diff to browser',
    tags:['WebSocket','ColumnDataSource patch'],
    body:`After all Python callbacks return, Bokeh's Tornado IOLoop flushes pending document changes over the WebSocket connection. Only changed data source columns are sent as a binary patch. The browser-side Bokeh JS client applies the patch to its local model and triggers a re-render. This is why reassigning <code>source.data</code> rather than mutating in-place is critical — in-place mutation is invisible to Bokeh's change tracker.`
  },
  { key:'undoredo', color:'purple', label:'10',
    title:'_on_undo() / _on_redo()',
    tags:['IOMixin','UndoStack','_restore_from_snapshot()'],
    body:`<strong>Undo:</strong> captures current state via <code>make_snapshot()</code> → <code>push_redo(current)</code>, then pops from <code>_undo</code> deque → calls <code>_restore_from_snapshot(snapshot)</code>. <strong>Redo:</strong> captures current state → appends directly to <code>_undo</code> deque (bypasses <code>push()</code> which would clear redo), pops from <code>_redo</code> → restores. Both finish with <code>_mark_unsaved()</code> which calls <code>_refresh_undo_redo_buttons()</code>.`
  }
];

const pipColors = {
  gray:'var(--gray-border)', purple:'var(--purple-border)',
  coral:'var(--coral-border)', teal:'var(--teal-border)', amber:'var(--amber-border)'
};

let currentFlow = 'canvas';
let allSteps = flowA;
let current = 0;

function buildTabs(steps) {
  const nav = document.getElementById('step-nav');
  nav.innerHTML = '';
  steps.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'step-tab'; btn.id = 'tab-' + s.key;
    btn.title = s.title;
    btn.innerHTML = `<span class="step-pip" style="background:${pipColors[s.color]}"></span>${s.label}`;
    btn.onclick = () => setActive(i);
    nav.appendChild(btn);
  });
}

function setActive(idx) {
  current = idx;
  const s = allSteps[idx];
  document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + s.key);
  if (tab) { tab.classList.add('active'); tab.scrollIntoView({block:'nearest',inline:'nearest'}); }
  document.getElementById('svg-canvas').querySelectorAll('.fl-node').forEach(n => {
    n.style.opacity = '0.38'; n.classList.remove('active');
  });
  const svgEl = document.getElementById('ca-' + s.key);
  if (svgEl) { svgEl.style.opacity = '1'; svgEl.classList.add('active'); }
  document.getElementById('dp-title').textContent = s.title;
  document.getElementById('dp-tags').innerHTML = s.tags.map(t => `<span class="tag ${s.color}">${t}</span>`).join('');
  document.getElementById('dp-body').innerHTML = s.body;
  document.getElementById('nav-counter').textContent = `${idx + 1} / ${allSteps.length}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === allSteps.length - 1;
}

function activate(rawKey) {
  const idx = allSteps.findIndex(s => s.key === rawKey);
  if (idx !== -1) setActive(idx);
}

function navStep(dir) {
  const next = current + dir;
  if (next >= 0 && next < allSteps.length) setActive(next);
}

buildTabs(flowA);
setActive(0);
</script>
